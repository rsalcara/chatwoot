# Sincroniza o develop do fork com o chatwoot/chatwoot oficial e, quando há
# novidade, publica a imagem atualizada no GHCR na mesma execução (o push feito
# com o GITHUB_TOKEN não dispara outros workflows, por isso o publish é chamado
# via workflow_call). Nossa feature (rótulo de autor nos grupos) vive no
# histórico do develop, então o merge do upstream a mantém aplicada — sem
# "reaplicar" manualmente. Em conflito: a sync falha e abre issue para revisão.
name: Sync with upstream (chatwoot/chatwoot)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      version: ${{ steps.merge.outputs.version }}
    steps:
      - name: Checkout develop (histórico completo)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/develop
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/chatwoot/chatwoot.git
          git fetch upstream develop
          git fetch upstream 'refs/tags/v*:refs/tags/v*'

          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/develop; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git push origin develop
              echo "Pushed: $AFTER"
            else
              echo "Upstream sem novidades no develop."
            fi
          else
            git merge --abort || true
            gh issue create \
              --title "Sync upstream falhou: conflito no merge" \
              --body "O merge automático de \`chatwoot/chatwoot@develop\` conflitou. Resolva manualmente (fetch upstream + merge develop) e reabra a sync. Última execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Não foi possível abrir a issue (ver permissões)."
            exit 1
          fi

          # Versões: replica a tag de release mais recente do upstream sobre o
          # develop JÁ MESCLADO do fork (a tag original aponta para o commit
          # sem a feature). Só publica a versão que ainda não existe no fork.
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$LATEST" ] && [ -z "$(git ls-remote --tags origin "refs/tags/$LATEST")" ]; then
            git tag -f "$LATEST" HEAD
            git push -f origin "refs/tags/$LATEST"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Nova versão upstream: $LATEST (tag criada sobre o develop do fork)"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Sem versão nova a publicar (latest: ${LATEST:-nenhuma})."
          fi

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || needs.sync.outputs.version != ''
    uses: ./.github/workflows/publish_ghcr.yml
    with:
      version: ${{ needs.sync.outputs.version }}
    permissions:
      contents: read
      packages: write

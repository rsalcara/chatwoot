# Publica a imagem CE do fork no GitHub Container Registry (GitHub Packages).
# Espelha o publish_foss_docker.yml (digest por plataforma + manifest), apontando
# para ghcr.io e usando o GITHUB_TOKEN — sem depender de secrets do Docker Hub.
name: Publish CE image to GHCR

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Versão upstream (ex.: v4.19.0) para tag adicional da imagem'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION_INPUT: ${{ inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Compute image tags
        run: |
          SANITIZED_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${SANITIZED_REF}-ce"
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            if [ "${{ github.ref_name }}" = "master" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:latest-ce"
            fi
            if [ -n "$VERSION_INPUT" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION_INPUT}-ce"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      VERSION_INPUT: ${{ inputs.version || '' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Compute image tags
        run: |
          SANITIZED_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${SANITIZED_REF}-ce"
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            if [ "${{ github.ref_name }}" = "master" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:latest-ce"
            fi
            if [ -n "$VERSION_INPUT" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION_INPUT}-ce"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG_ARGS=""
          for t in $IMAGE_TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker buildx imagetools create $TAG_ARGS \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'master' && 'latest-ce' || format('{0}-ce', github.ref_name) }}"

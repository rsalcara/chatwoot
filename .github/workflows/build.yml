name: Build and publish image

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tags: ${{ steps.tags.outputs.tags }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Compute image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${{ github.ref_name }}"
            if [ "${{ github.ref_name }}" = "master" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
            fi
            VERSION=$(git ls-remote --tags https://github.com/chatwoot/chatwoot.git "v*" | awk -F/ '{print $NF}' | sed 's/\^{}$//' | sort -Vu | tail -1)
            if [ -n "$VERSION" ] && [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          TAG_ARGS=""
          for t in $IMAGE_TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          FIRST_TAG=$(echo "$IMAGE_TAGS" | head -1)
          docker buildx imagetools inspect "$FIRST_TAG"

  promote:
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: github.ref_name == 'develop'
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop
          if git merge --no-edit origin/develop; then
            git push origin master
          else
            git merge --abort || true
            gh issue create \
              --title "Promoção develop→master falhou (conflito)" \
              --body "O merge automático de develop no master conflitou. Resolva manualmente e reexecute. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || true
            exit 1
          fi
